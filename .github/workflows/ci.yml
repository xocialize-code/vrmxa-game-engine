# Lints, type-checks and tests the engine workspace, and runs the spikes that need no models, on every push
# and pull request.
# Modelled on xocialize-code/vrmxa-avatar-studio's ci.yml. The VRM models the character spikes need are
# never committed (see .gitignore), so those suites run on the development Mac only. vrmxa-core is public
# (xocialize-code/vrmxa-core, pinned in vrmxa-core.json, AB-A-0337): CI needs no key for it. The tests that
# read characters also need VRMXA_Specification, which is private, so they skip here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install the workspace (postinstall applies engine/patches)
        run: npm ci

      - name: The three-vrm patch matches the installed three-vrm and the install applied it (AB-D-0274)
        run: node scripts/patch-three-vrm.mjs --check --require-patched

      - name: Lint (incl. vrmxg/deterministic on simulation packages)
        run: npm run lint

      - name: Type-check (JSDoc, tsc --checkJs)
        run: npm run typecheck

      - name: Test every package
        run: npm test

      - name: Sample content has a licence for every file
        run: node content/sample/tools/check-licences.mjs

      - name: Starter content has a licence for every file, and every content file is CC0 (AB-D-0297)
        run: node content/starter/tools/check-licences.mjs

      - name: spike-registry
        working-directory: spike-registry
        run: npm ci && npm test && node scripts/mcp-client.mjs > /dev/null

      - name: The generated reference and llms.txt are what the code produces (AB-T-0611)
        run: node scripts/docs-reference.mjs --check

      - name: The documentation site builds, its links and anchors resolve, and the Worker's config is valid
        working-directory: docs
        run: npm ci && npm run build && npm run links && npm run worker:check
        env:
          WRANGLER_SEND_METRICS: "false"
