<!doctype html>
<meta charset="utf-8">
<title>repro 4: MSAA resolve under load</title>
<!-- Raw WebGPU, no three.js (AB-T-0589). One static frame drawn again and again: 3,000 overlapping triangles into an
     rgba16float target, then a pass that tone-maps it to rgba8unorm; both are read back and hashed every time. Nothing
     changes between iterations, so every hash must equal the first. Three ways to anti-alias, interleaved per iteration:
       hw      MSAA 4x with a resolveTarget (the hardware resolve, what three's PassNode and framebuffer target use)
       shader  MSAA 4x stored, then a pass that averages the 4 samples itself (textureLoad on texture_multisampled_2d)
       none    one sample
     ?iters=N (2000)  ?modes=hw,shader,none  ?tris=N (3000)
     Run it alone and while another process loads the GPU (WKWebView exporting the film): AB-T-0589 is a ±1 difference in a
     few edge pixels of one frame in a few hundred, seen only under that load. -->
<body style="margin:0;background:#fff">
<pre id="out" style="font:12px monospace"></pre>
<script type="module">
const q = new URLSearchParams(location.search);
const W = 1024, H = 576, ITERS = +(q.get('iters') ?? 2000), TRIS = +(q.get('tris') ?? 3000);
const MODES = (q.get('modes') ?? 'hw,shader,none').split(',');
const log = (s) => { document.getElementById('out').textContent += s + '\n'; };
const result = { pass: false, iters: ITERS, tris: TRIS, size: [W, H], modes: {}, ua: navigator.userAgent };
try {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  device.onuncapturederror = (e) => { result.error = String(e.error?.message ?? e.error); };
  // a fixed pseudo-random scene (xorshift), the same every load
  let s = 0x9e3779b9; const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const v = new Float32Array(TRIS * 3 * 8);
  for (let t = 0; t < TRIS; t++) {
    const cx = rnd() * 2.2 - 1.1, cy = rnd() * 2.2 - 1.1, r = 0.02 + rnd() * 0.12, z = rnd();
    const col = [rnd() * 3, rnd() * 3, rnd() * 3];
    for (let k = 0; k < 3; k++) {
      const a = rnd() * Math.PI * 2, o = (t * 3 + k) * 8;
      v.set([cx + Math.cos(a) * r, cy + Math.sin(a) * r, z, 1, ...col, 1], o);
    }
  }
  const vbuf = device.createBuffer({ size: v.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vbuf, 0, v);
  const sceneCode = /* wgsl */`
    struct O { @builtin(position) p: vec4f, @location(0) c: vec4f, @location(1) q: vec2f };
    @vertex fn vs(@location(0) p: vec4f, @location(1) c: vec4f) -> O { var o: O; o.p = p; o.c = c; o.q = p.xy; return o; }
    @fragment fn fs(i: O) -> @location(0) vec4f {
      // some arithmetic, so the values are not round numbers
      let l = 0.35 + 0.65 * abs(sin(i.q.x * 7.13 + i.q.y * 3.71));
      return vec4f(i.c.rgb * l + vec3f(0.013, 0.021, 0.034), 1.0);
    }`;
  const fullCode = (body) => /* wgsl */`
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      let p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3)); return vec4f(p[i], 0, 1); }
    ${body}`;
  const resolveCode = fullCode(/* wgsl */`
    @group(0) @binding(0) var t: texture_multisampled_2d<f32>;
    @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
      let c = vec2i(p.xy); var a = vec4f(0);
      for (var k = 0; k < 4; k++) { a += textureLoad(t, c, k); }
      return a * 0.25;
    }`);
  const toneCode = fullCode(/* wgsl */`
    @group(0) @binding(0) var t: texture_2d<f32>;
    @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
      let c = textureLoad(t, vec2i(p.xy), 0).rgb; let m = c / (1.0 + c);
      return vec4f(pow(m, vec3f(1.0 / 2.2)), 1.0);
    }`);
  const vertexLayout = [{ arrayStride: 32, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x4' }, { shaderLocation: 1, offset: 16, format: 'float32x4' }] }];
  const scenePipe = (samples) => device.createRenderPipeline({
    layout: 'auto', vertex: { module: device.createShaderModule({ code: sceneCode }), buffers: vertexLayout },
    fragment: { module: device.createShaderModule({ code: sceneCode }), targets: [{ format: 'rgba16float' }] },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' }, multisample: { count: samples },
  });
  const fullPipe = (code, format) => device.createRenderPipeline({ layout: 'auto', vertex: { module: device.createShaderModule({ code }) }, fragment: { module: device.createShaderModule({ code }), targets: [{ format }] } });
  const tex = (format, samples = 1, usage = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC) => device.createTexture({ size: [W, H], format, sampleCount: samples, usage: samples > 1 ? GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING : usage });
  const pipes = { ms: scenePipe(4), one: scenePipe(1), resolve: fullPipe(resolveCode, 'rgba16float'), tone: fullPipe(toneCode, 'rgba8unorm') };
  const T = {
    ms: tex('rgba16float', 4), msDepth: device.createTexture({ size: [W, H], format: 'depth24plus', sampleCount: 4, usage: GPUTextureUsage.RENDER_ATTACHMENT }),
    depth: device.createTexture({ size: [W, H], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT }),
    hdr: tex('rgba16float'), ldr: tex('rgba8unorm'),
  };
  const resolveGroup = device.createBindGroup({ layout: pipes.resolve.getBindGroupLayout(0), entries: [{ binding: 0, resource: T.ms.createView() }] });
  const toneGroup = device.createBindGroup({ layout: pipes.tone.getBindGroupLayout(0), entries: [{ binding: 0, resource: T.hdr.createView() }] });
  const hdrBuf = device.createBuffer({ size: W * H * 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const ldrBuf = device.createBuffer({ size: W * H * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const color = (view, resolveTarget) => ({ view, resolveTarget, loadOp: 'clear', storeOp: resolveTarget ? 'discard' : 'store', clearValue: [0.2, 0.25, 0.3, 1] });
  const depth = (view) => ({ view, depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'discard' });
  const full = (enc, pipe, group, view) => { const p = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] }); p.setPipeline(pipe); p.setBindGroup(0, group); p.draw(3); p.end(); };
  const fnv = (u8) => { const u = new Uint32Array(u8.buffer, u8.byteOffset, u8.byteLength >> 2); let h = 0x811c9dc5; for (let i = 0; i < u.length; i++) h = Math.imul(h ^ u[i], 0x01000193); return (h >>> 0).toString(16).padStart(8, '0'); };

  async function frame(mode) {
    const enc = device.createCommandEncoder();
    const scene = (pipe, attach, depthView) => { const p = enc.beginRenderPass({ colorAttachments: [attach], depthStencilAttachment: depth(depthView) }); p.setPipeline(pipe); p.setVertexBuffer(0, vbuf); p.draw(TRIS * 3); p.end(); };
    if (mode === 'hw') scene(pipes.ms, color(T.ms.createView(), T.hdr.createView()), T.msDepth.createView());
    else if (mode === 'shader') { scene(pipes.ms, color(T.ms.createView()), T.msDepth.createView()); full(enc, pipes.resolve, resolveGroup, T.hdr.createView()); }
    else scene(pipes.one, color(T.hdr.createView()), T.depth.createView());
    full(enc, pipes.tone, toneGroup, T.ldr.createView());
    enc.copyTextureToBuffer({ texture: T.hdr }, { buffer: hdrBuf, bytesPerRow: W * 8 }, [W, H]);
    enc.copyTextureToBuffer({ texture: T.ldr }, { buffer: ldrBuf, bytesPerRow: W * 4 }, [W, H]);
    device.queue.submit([enc.finish()]);
    await Promise.all([hdrBuf.mapAsync(GPUMapMode.READ), ldrBuf.mapAsync(GPUMapMode.READ)]);
    const hdr = new Uint8Array(hdrBuf.getMappedRange()).slice(), ldr = new Uint8Array(ldrBuf.getMappedRange()).slice();
    hdrBuf.unmap(); ldrBuf.unmap();
    return { hdr, ldr };
  }
  /** Where two read-backs differ: texels, the largest difference (half-float ulps for hdr, levels for ldr), a few spots. */
  function diff(a, b, bytesPer) {
    let n = 0, max = 0; const at = [];
    const av = bytesPer === 8 ? new Uint16Array(a.buffer) : a, bv = bytesPer === 8 ? new Uint16Array(b.buffer) : b;
    for (let i = 0; i < av.length; i++) if (av[i] !== bv[i]) {
      n++; max = Math.max(max, Math.abs(av[i] - bv[i]));
      if (at.length < 6) { const px = Math.floor(i / 4); at.push({ x: px % W, y: Math.floor(px / W), ch: i % 4, a: av[i], b: bv[i] }); }
    }
    return { values: n, max, at };
  }
  const ref = {}, t0 = performance.now();
  for (const m of MODES) result.modes[m] = { hdrDistinct: new Set(), ldrDistinct: new Set(), hdrDiffer: 0, ldrDiffer: 0, firstDiff: null };
  for (let i = 0; i < ITERS; i++) {
    for (const m of MODES) {
      const r = await frame(m), hh = fnv(r.hdr), lh = fnv(r.ldr), o = result.modes[m];
      o.hdrDistinct.add(hh); o.ldrDistinct.add(lh);
      if (!ref[m]) { ref[m] = { ...r, hh, lh }; continue; }
      if (hh !== ref[m].hh) o.hdrDiffer++;
      if (lh !== ref[m].lh) o.ldrDiffer++;
      if ((hh !== ref[m].hh || lh !== ref[m].lh) && !o.firstDiff) o.firstDiff = { iter: i, hdr: diff(r.hdr, ref[m].hdr, 8), ldr: diff(r.ldr, ref[m].ldr, 4) };
    }
    if (i % 200 === 0) log(`${i}: ${MODES.map((m) => `${m} ${result.modes[m].hdrDiffer}/${result.modes[m].ldrDiffer}`).join('  ')}`);
  }
  result.ms = Math.round(performance.now() - t0);
  for (const m of MODES) { const o = result.modes[m]; o.hdrDistinct = o.hdrDistinct.size; o.ldrDistinct = o.ldrDistinct.size; }
  result.pass = MODES.every((m) => result.modes[m].hdrDiffer === 0 && result.modes[m].ldrDiffer === 0);
  result.observation = MODES.map((m) => `${m}: ${result.modes[m].hdrDiffer} of ${ITERS - 1} hdr and ${result.modes[m].ldrDiffer} ldr read-backs differ from the first`).join('; ');
} catch (e) { result.error = String(e?.stack ?? e); }
log(JSON.stringify(result, null, 1));
window.__result = result; window.READY = true;
</script>
